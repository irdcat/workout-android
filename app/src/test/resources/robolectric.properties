# Defaults for Robolectric tests without their own @Config, such as the shared navigation
# tests, which can't use Robolectric's annotations because they also run on a device.
# Phone-sized: the default screen is small enough to push buttons out of view.
application=dagger.hilt.android.testing.HiltTestApplication
qualifiers=w411dp-h891dp
# The Android the JVM tests emulate: Robolectric can't run the app's targetSdk (37) yet,
# and 36 needs JVM module flags it doesn't set itself.
sdk=35
